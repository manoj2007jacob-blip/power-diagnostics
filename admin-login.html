<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Power Diagnostics UAE</title>
  <meta name="description" content="Secure administrative control suite login for Power Diagnostics UAE.">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons 1.11.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Admin Custom CSS -->
  <link href="admin.css" rel="stylesheet">
</head>
<body class="admin-login-body">

  <div class="admin-login-grid-bg"></div>
  <div class="admin-login-glow"></div>

  <div class="admin-login-card">
    <!-- Brand Header -->
    <div class="text-center mb-4">
      <div class="admin-brand-icon mb-3 mx-auto" style="width: 52px; height: 52px; font-size: 1.6rem; border-radius: 14px;">
        <i class="bi bi-shield-lock-fill"></i>
      </div>
      <h4 class="fw-bold text-white mb-1">Power Diagnostics</h4>
      <p class="text-white-50 small mb-0">UAE Management & Control Suite</p>
    </div>

    <!-- Quick Demo Notice -->
    <div class="alert alert-primary bg-primary-subtle border-primary-subtle text-primary py-2 px-3 small rounded-3 mb-4 d-flex align-items-center justify-content-between">
      <div>
        <i class="bi bi-info-circle-fill me-1"></i> <strong>Demo Access:</strong> admin / admin123
      </div>
      <button type="button" id="btnDemoLogin" class="btn btn-sm btn-primary py-0 px-2 fw-semibold" style="font-size: 0.75rem;">
        Autofill
      </button>
    </div>

    <!-- Error Alert Banner -->
    <div id="loginErrorAlert" class="alert alert-danger py-2 px-3 small rounded-3 mb-3 d-none"></div>

    <!-- Login Form -->
    <form id="adminLoginForm">
      <div class="mb-3">
        <label class="form-label text-white-50 small fw-semibold">Administrative Email</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent border-secondary text-white-50" style="border-color: rgba(255,255,255,0.15) !important;">
            <i class="bi bi-envelope"></i>
          </span>
          <input type="email" id="adminEmail" class="form-control admin-form-control" placeholder="admin@powerdiagnostics.ae" value="admin@powerdiagnostics.ae" required autocomplete="username">
        </div>
      </div>

      <div class="mb-3">
        <div class="d-flex align-items-center justify-content-between mb-1">
          <label class="form-label text-white-50 small fw-semibold mb-0">Password</label>
          <a href="#" class="text-decoration-none text-primary small" style="font-size: 0.75rem;" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal">Forgot?</a>
        </div>
        <div class="input-group">
          <span class="input-group-text bg-transparent border-secondary text-white-50" style="border-color: rgba(255,255,255,0.15) !important;">
            <i class="bi bi-key"></i>
          </span>
          <input type="password" id="adminPassword" class="form-control admin-form-control" placeholder="••••••••" value="admin123" required autocomplete="current-password">
          <button type="button" class="btn btn-outline-secondary text-white-50 border-secondary" style="border-color: rgba(255,255,255,0.15) !important;" id="togglePasswordBtn">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" id="rememberAdmin" checked>
        <label class="form-check-label text-white-50 small" for="rememberAdmin">
          Stay signed in on this device
        </label>
      </div>

      <button type="submit" id="btnLoginSubmit" class="btn btn-admin-login w-100 mb-3">
        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Portal
      </button>

      <div class="text-center">
        <a href="index.html" class="text-white-50 text-decoration-none small hover-underline">
          <i class="bi bi-arrow-left me-1"></i> Return to Client Website
        </a>
      </div>
    </form>
  </div>

  <!-- Forgot Password Modal -->
  <div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content border-0 rounded-4 shadow-lg overflow-hidden">
        <div class="modal-header modal-header-corporate p-3 text-white">
          <h6 class="modal-title fw-bold mb-0"><i class="bi bi-shield-check me-1"></i> Password Reset</h6>
          <button type="button" class="btn-close btn-close-white shadow-none" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-3">
          <p class="small text-muted mb-3">Please contact IT Systems Security or use default demo credentials (<code>admin123</code>).</p>
          <button type="button" class="btn btn-primary w-100 btn-sm" data-bs-dismiss="modal">Understood</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Admin Script -->
  <script src="admin.js"></script>
  <script>
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const pwdInput = document.getElementById('adminPassword');
    if (toggleBtn && pwdInput) {
      toggleBtn.addEventListener('click', () => {
        const type = pwdInput.getAttribute('type') === 'password' ? 'text' : 'password';
        pwdInput.setAttribute('type', type);
        toggleBtn.querySelector('i').classList.toggle('bi-eye');
        toggleBtn.querySelector('i').classList.toggle('bi-eye-slash');
      });
    }
  </script>
</body>
</html>
