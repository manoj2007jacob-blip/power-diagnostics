name: Backend CI/CD (.NET 10 Web API to Azure App Service)

on:
  push:
    branches:
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-cd.yml'
  pull_request:
    branches:
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-cd.yml'

jobs:
  build:
    name: Build & Test Backend (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Restore Dependencies
        run: dotnet restore backend/PowerDiagnostics.slnx

      - name: Build Solution (Release)
        run: dotnet build backend/PowerDiagnostics.slnx --configuration Release --no-restore

      - name: Publish API Project (Self-Contained Linux x64)
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: >
          dotnet publish backend/src/API/PowerDiagnostics.Api/PowerDiagnostics.Api.csproj
          --configuration Release
          --output ./publish
          -r linux-x64
          --self-contained true
          --no-build

      - name: Upload Artifact for Deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: backend-api-package
          path: ./publish

  deploy:
    name: Deploy to Azure App Service
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-api-package
          path: ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_BACKEND_APP_NAME || 'power-diagnostics-api' }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
